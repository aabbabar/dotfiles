set -a terminal-features "tmux-256color:RGB"
set -g prefix C-SPACE
set -g base-index 1
set -g renumber-windows on   
set -g mode-keys vi

set -g status-style "bg=default"
set -g window-status-current-style "fg=black bg=white  "
set -g status-interval 1
set -g status-position bottom
set -g status-justify absolute-centre
set -g status-left "#{?client_prefix,?, }   #S     "
set -g status-left-length 320
set -g status-right "%H:%M   %a %d %b %y"

# center window list
set -g window-status-format "  #I:#W#{?window_flags,#{window_flags}, }  "
set -g window-status-current-format "  #I:#W#{?window_flags,#{window_flags}, }  "

# add padding above status bar
# set -g status 2
# set -g status-format[0] ''
# set -g status-format[1] '#[align=left]#{?client_prefix,?, }   #S     #[align=centre]#{W:  #I:#W#{?window_flags,#{window_flags}, }  ,#[fg=black,bg=white]  #I:#W#{?window_flags,#{window_flags}, }  #[default]}#[align=right]%H:%M   %a %d %b %y'

bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# Resize panes with prefix + H J K L
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

set-option -g mode-keys vi
set-option -g set-clipboard on

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi v send -X begin-selection

# sesh
if-shell "command -v sesh >/dev/null 2>&1" \
  "bind-key s display-popup -E -w 50% -h 50% -d '#{pane_current_path}' -T 'Sesh' 'sesh picker --tmux --config --zoxide --hide-duplicates'"
if-shell "command -v sesh >/dev/null 2>&1" \
  "bind-key Tab run-shell 'sesh last'"

if-shell "command -v workmux >/dev/null 2>&1" \
  "bind-key a run-shell 'workmux sidebar'"
if-shell "command -v workmux >/dev/null 2>&1" \
  "bind-key w display-popup -E -w 90% -h 85% -d '#{pane_current_path}' -T 'Workmux' 'workmux dashboard --tab worktrees'"
